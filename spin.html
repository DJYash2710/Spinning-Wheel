<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>

let CanvasWidth;
let CanvasHeight;
let TotalSegments = 6;
let SegmentAngle = 360 / TotalSegments;

// Spin state
let currentAngle = 0;
let spinSpeed = 0;
let targetSpeed = 0;
let isSpinning = false;
const MAX_SPEED = 20;       // degrees per frame at full speed
const ACCEL = 0.25;        // how fast it accelerates
const DECEL = 0.02;        // how fast it decelerates when stopping

// Alternating colors for visual effect
const segmentColors = [
  "#FF6B6B", "#FFFFFF",
  "#FFD93D", "#FFFFFF",
  "#6BCB77", "#FFFFFF"
];

function setup() {
  CanvasWidth = windowWidth;
  CanvasHeight = windowHeight;
  createCanvas(CanvasWidth, CanvasHeight);
  angleMode(DEGREES);
}

function draw() {
  background("aqua");
  
  // Smoothly approach target speed
  if (isSpinning) {
    spinSpeed += (targetSpeed - spinSpeed) * ACCEL;
  } else {
    spinSpeed *= (1 - DECEL); // decelerate smoothly to 0
    if (abs(spinSpeed) < 0.05) spinSpeed = 0;
  }
  
  currentAngle += spinSpeed;
  
  translate(CanvasWidth / 2, CanvasHeight / 2);
  rotate(currentAngle);
  
  for (let i = 0; i < TotalSegments; i++) {
    let startAngle = i * SegmentAngle;
    let stopAngle = (i + 1) * SegmentAngle;
    
    fill(segmentColors[i % segmentColors.length]);
    stroke(80);
    strokeWeight(2);
    arc(0, 0, 400, 400, startAngle, stopAngle, PIE);
  }
  
  // Center hub
  fill("#222");
  noStroke();
  circle(0, 0, 24);
}

function mousePressed() {
  // Check if click is near the wheel center
  let d = dist(mouseX, mouseY, CanvasWidth / 2, CanvasHeight / 2);
  if (d < 210) { // within wheel radius (200) + small buffer
    if (!isSpinning) {
      isSpinning = true;
      targetSpeed = MAX_SPEED;
    } else {
      isSpinning = false; // start decelerating
    }
  }
}

function windowResized() {
  CanvasWidth = windowWidth;
  CanvasHeight = windowHeight;
  resizeCanvas(CanvasWidth, CanvasHeight);
}

</script>
</body>
</html>
